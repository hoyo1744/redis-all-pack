name: redis-all-pack-monitoring

# exporter 를 여기 둔다. 클러스터 compose 는 Redis 만 갖게 해서 가볍게 유지한다.
# exporter 는 호스트 포트로 노드에 붙으므로 클러스터가 떠 있기만 하면 된다.
services:
  prometheus:
    image: prom/prometheus
    container_name: redis-all-pack-prometheus
    ports: ["9090:9090"]
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana
    container_name: redis-all-pack-grafana
    ports: ["3000:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin

  # 노드별로 하나씩. 2주차 핫키·쏠림은 노드 단위 지표가 있어야 보인다.
  redis-exporter-1:
    image: oliver006/redis_exporter:latest
    container_name: redis-all-pack-exporter-1
    ports: ["9121:9121"]
    environment:
      REDIS_ADDR: "redis://host.docker.internal:7001"
    extra_hosts: ["host.docker.internal:host-gateway"]

  redis-exporter-2:
    image: oliver006/redis_exporter:latest
    container_name: redis-all-pack-exporter-2
    ports: ["9122:9121"]
    environment:
      REDIS_ADDR: "redis://host.docker.internal:7002"
    extra_hosts: ["host.docker.internal:host-gateway"]

  redis-exporter-3:
    image: oliver006/redis_exporter:latest
    container_name: redis-all-pack-exporter-3
    ports: ["9123:9121"]
    environment:
      REDIS_ADDR: "redis://host.docker.internal:7003"
    extra_hosts: ["host.docker.internal:host-gateway"]

  # ── 레플리카용 (3주차 레플리카 읽기) ──────────────────────────────
  # 레플리카 없이 클러스터만 띄웠으면 이 셋은 down 타깃으로 남는다. 무해하다.
  #   docker compose -f docker/monitoring-compose.yml --profile replica up -d
  redis-exporter-4:
    image: oliver006/redis_exporter:latest
    container_name: redis-all-pack-exporter-4
    profiles: ["replica"]
    ports: ["9124:9121"]
    environment:
      REDIS_ADDR: "redis://host.docker.internal:7004"
    extra_hosts: ["host.docker.internal:host-gateway"]

  redis-exporter-5:
    image: oliver006/redis_exporter:latest
    container_name: redis-all-pack-exporter-5
    profiles: ["replica"]
    ports: ["9125:9121"]
    environment:
      REDIS_ADDR: "redis://host.docker.internal:7005"
    extra_hosts: ["host.docker.internal:host-gateway"]

  redis-exporter-6:
    image: oliver006/redis_exporter:latest
    container_name: redis-all-pack-exporter-6
    profiles: ["replica"]
    ports: ["9126:9121"]
    environment:
      REDIS_ADDR: "redis://host.docker.internal:7006"
    extra_hosts: ["host.docker.internal:host-gateway"]
